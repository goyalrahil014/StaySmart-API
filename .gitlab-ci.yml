stages:
  - build
  - test
  - docker

build:
  stage: build
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - echo "Build complete"

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pytest tests/

docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t staysmart .
    - echo "Docker image built"
